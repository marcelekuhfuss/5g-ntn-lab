# OCUDU gNB — ZMQ virtual radio, band n3, 10 MHz, 15 kHz SCS.
# Adapted from the official OCUDU "Building a 5G network with srsUE" tutorial
# (https://docs.ocudu.org/tutorials/srsue/), BSD-3-Clause-Open-MPI.
#
# 10 MHz (52 PRB, 11.52 Msps) is the tutorial's ZMQ setting: it is the combination
# known to work with srsUE and keeps CPU load low. Must match configs/ue_zmq.conf.

cu_cp:
  amf:
    addr: 10.53.1.2            # Open5GS AMF in Docker
    port: 38412
    bind_addr: 10.53.1.1       # host side of the Docker bridge
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200       # seconds; keeps the idle UE attached during experiments

ru_sdr:
  device_driver: zmq
  # gNB transmits on 2000 (DL), receives on 2001 (UL).
  # In stage 2 these will point at the GNU Radio broker instead of the UE.
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 368500             # 1842.5 MHz, band n3
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdcch:
    common:
      ss0_index: 0             # srsUE-compatible search space zero
      coreset0_index: 6        # srsUE-compatible CORESET#0 for 10 MHz
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false   # fallback DCI formats (srsUE)
  prach:
    prach_config_index: 1
    total_nof_ra_preambles: 64
    nof_ssb_per_ro: 1
    nof_cb_preambles_per_ssb: 64
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: warning           # use "info" when debugging an attach
  hex_max_size: 0

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap
